<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" >
    <meta http-equiv="X-UA-Compatible" content="IE=edge" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Generative Landscapes</title> <link rel="stylesheet" href="style.css" />
    <script src="lib/p5.min.js"></script>
    <script src="../packages/use-local-libs.js"></script>
    <script>
      // This gets replaced at build time or defaults to false
      window.USE_LOCAL_LIBS = window.USE_LOCAL_LIBS || false;
    </script>
    <script>
      function loadScriptSequentially(sources, callback) {
        let index = 0;
        function next() {
          if (index >= sources.length) {
            callback && callback();
            return;
          }
          
          const script = document.createElement('script');
          script.src = sources[index];
          script.onload = () => {
            console.log('Loaded', sources[index])
            index++;
            next();
          };
          script.onerror = () => {
            console.error('Failed to load', sources[index]);
          };

          document.head.appendChild(script);
        }

        next();
      }

      function loadSketch(src) {
        const s = document.createElement('script');
        s.type = 'module';
        s.src = src;
        document.body.appendChild(s);
        s.onload = () => {
          console.log('Loaded sketch', src)
        };
        s.onerror = () => {
          console.error('Failed to load sketch', src);
        };
      }

      function loadCSS(href) {
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = href;
        l.onload = () => {
          console.log('Loaded link', href)
        };
        l.onerror = () => {
          console.error('Failed to load link', href);
        };
        document.head.appendChild(l);
      }

    </script>
    <script>
      if (window.USE_LOCAL_LIBS) {
        console.log('Loading libs from local files')
        loadScriptSequentially(
          [
            '../packages/node_modules/p5/lib/addons/p5.sound.min.js',
            '../packages/node_modules/p5.capture/dist/p5.capture.umd.js',
            '../packages/tailwind.min.js',
          ],
          () => {
            console.log('Local libs loaded, loading sketch');
            loadSketch('sketch.js')
            loadCSS('../packages/css/tailwind.css');
          }
        );
        // loadCSS('https://cdn.jsdelivr.net/npm/daisyui@3.7.3/dist/full.css');
      } else {
        console.log('Loading libs from CDNs')
        loadScriptSequentially(
          [
            'https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js',
            'https://cdn.jsdelivr.net/npm/p5.capture',
            'https://cdn.tailwindcss.com'
          ],
          () => {
            console.log('CDN Libs loaded, loading sketch');
            loadSketch('sketch.js')

          }
        );
        loadCSS('https://cdn.jsdelivr.net/npm/daisyui@3.7.3/dist/full.css');
      }
    </script>
</head>
<body>
  <div class="flex h-screen">
    <div class="w-140 overflow-y-auto" id="toolbar"></div>
    <div class="grow h-screen">
      <div id="sketch-container" style="width: 100%; height: 100%; cursor: none;">
        <div id="canvas-wrapper" style="background-color: #0F0F0F;"></div>
      </div>
    </div>
  </div>
</body>
</html>
